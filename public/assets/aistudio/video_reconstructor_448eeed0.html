<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Reconstructor — Hybrid 3D + 2D Paper-Cutout Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
    body { background: #0b0d11; color: #e5e7eb; margin: 0; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #13161d; }
    ::-webkit-scrollbar-thumb { background: #2d3342; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f475c; }
    .checkerboard {
      background-color: #161922;
      background-image:
        linear-gradient(45deg, #1f2430 25%, transparent 25%),
        linear-gradient(-45deg, #1f2430 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1f2430 75%),
        linear-gradient(-45deg, transparent 75%, #1f2430 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    canvas.stage-preview {
      aspect-ratio: 9 / 16;
      max-height: 70vh;
      width: auto;
      max-width: 100%;
    }
  </style>
  <!-- Import Map for Three.js and mp4-muxer -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP STUDIO HEADER -->
  <header class="bg-[#11141c] border-b border-slate-800 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-rose-600 to-amber-500 flex items-center justify-center font-extrabold text-white shadow-lg">
          VR
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">Video Reconstructor</h1>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-300 border border-rose-500/30 font-medium">
              3D Three.js + 2D Paper-Cutout Pipeline
            </span>
          </div>
          <p class="text-xs text-slate-400">720×1280 (9:16) Deterministic Reconstruction Studio</p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <label class="text-xs text-slate-400 hidden sm:inline">Gemini API Key (optional):</label>
        <input id="apiKeyInput" type="password" placeholder="Leave blank in Canvas runtime"
          class="bg-[#181c27] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 w-44 sm:w-56 focus:outline-none focus:border-rose-500" />
        <button id="quickDemoJumpBtn"
          class="text-xs px-3 py-1.5 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 font-medium transition">
          Load Reference Preset
        </button>
      </div>
    </div>

    <!-- 8-STAGE GATED STEPPER BAR -->
    <nav id="stepperNav" class="max-w-7xl mx-auto mt-3 grid grid-cols-4 sm:grid-cols-8 gap-1.5"></nav>
  </header>

  <!-- TOAST / STATUS BANNER -->
  <div id="toastBanner" class="hidden fixed bottom-4 right-4 z-50 max-w-md bg-slate-900 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl shadow-2xl text-xs leading-relaxed"></div>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
    <div id="stageContainer" class="space-y-6"></div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { Muxer, ArrayBufferTarget } from 'mp4-muxer';

    /* =========================================================================
       1. APPLICATION STATE & STRICT GATED PIPELINE DEFINITIONS
       ========================================================================= */
    const STAGES = [
      { id: 1, key: 'INPUT',      title: '1. Input',      desc: 'Source Video / URL' },
      { id: 2, key: 'ANALYZE',    title: '2. Analyze',    desc: 'Gemini Shot List' },
      { id: 3, key: 'KEYFRAMES',  title: '3. Keyframes',  desc: 'Shot Stills' },
      { id: 4, key: 'CHARACTERS', title: '4. Characters', desc: 'Parts Sheet (#FF00FF)' },
      { id: 5, key: 'AUTOCUT',    title: '5. Auto-Cut',   desc: 'Mask, Halo & Pivots' },
      { id: 6, key: 'SCENE',      title: '6. 3D Scene',   desc: 'Three.js World + Rig' },
      { id: 7, key: 'ANIMATE',    title: '7. Animate',    desc: 'Deterministic renderFrame(t)' },
      { id: 8, key: 'EXPORT',     title: '8. Export',     desc: 'WebCodecs MP4 + Captions' }
    ];

    const state = {
      currentStage: 1,
      approvedStages: new Set(),

      // Stage 1: Input
      inputMode: 'demo', // 'demo' | 'file' | 'youtube'
      youtubeUrl: 'https://youtube.com/shorts/PpOm4_2WF_U',
      videoFile: null,
      videoObjectUrl: null,
      videoMeta: {
        name: 'reference_grandma_knitting.mp4 (Built-in Reference Scene)',
        width: 720,
        height: 1280,
        duration: 2.0,
        fps: 30,
        aspectRatio: '9:16'
      },

      // Stage 2: Analyze
      isAnalyzing: false,
      showRawJson: false,
      shotList: [],

      // Stage 3: Keyframes
      keyframes: [], // [{ shotIndex, timestamp, dataUrl }]

      // Stage 4: Characters
      uniqueCharacters: ['Grandma'],
      isGeneratingSheet: false,
      partsSheetDataUrl: null,
      partsSheetSource: 'none', // 'none' | 'api' | 'uploaded' | 'sample'

      // Stage 5: Auto-Cut & Pivots
      chromaTolerance: 95,
      haloRadius: 6,
      cutPieces: [], // [{ id, role, imageDataUrl, haloDataUrl, width, height, pivotX, pivotY, bbox }]
      selectedPieceId: null,

      // Stage 6 & 7: 3D Scene & Deterministic Timeline
      timelineConfig: {
        fps: 30,
        duration: 2.0,
        headTiltAmp: 0.045,
        headTiltFreq: 2.0,
        armSwingAmp: 0.22,
        armSwingFreq: 5.0,
        bodyBobAmp: 0.035,
        bodyBobFreq: 2.0,
        scarfStartT: 0.45,
        scarfEndT: 1.95,
        lightBaseIntensity: 2.6,
        lightFlickerAmp: 0.28,
        cameraZoomStart: 5.4,
        cameraZoomEnd: 5.05
      },

      // Stage 8: Playback & Export
      currentTime: 0.0,
      isPlaying: false,
      isExporting: false,
      exportProgress: 0,
      exportStatus: ''
    };

    /* =========================================================================
       2. DEFAULT REFERENCE DATA (MATCHING ATTACHED GRANDMA + SCARF SCENE)
       ========================================================================= */
    function getDefaultShotList() {
      return [
        {
          start: 0.0,
          end: 1.0,
          camera: { movement: 'Static medium-wide establishing hold', angle: 'Eye-level slight downward tilt (12 deg)' },
          environment: {
            surfaces: 'Warm tan mortar brick wall with arched doorway; grey-brown radial cobblestone floor',
            lighting: 'Warm courtyard lantern point light + soft ambient daylight from archway',
            props: 'Wooden knitting needles with orange ball tips; short red-and-yellow striped scarf'
          },
          characters: [
            { name: 'Grandma', pose: 'Standing centered in front of brick wall & arch', action: 'Knitting calmly with gentle head nod' }
          ],
          captions: [
            { word: 'she', start: 0.05, end: 0.35 },
            { word: 'just', start: 0.35, end: 0.95 }
          ]
        },
        {
          start: 1.0,
          end: 2.0,
          camera: { movement: 'Subtle slow dolly-in toward floor & character', angle: 'Eye-level slight downward tilt (14 deg)' },
          environment: {
            surfaces: 'Warm tan mortar brick wall with arched doorway; grey-brown radial cobblestone floor',
            lighting: 'Warm flickering courtyard light casting soft drop shadow beneath character & scarf',
            props: 'Long 3D red-and-yellow striped knitted scarf snaking forward across cobblestones'
          },
          characters: [
            { name: 'Grandma', pose: 'Standing centered, arms rhythmically knitting', action: 'Continuous rapid needle motion as scarf lengthens' }
          ],
          captions: [
            { word: 'just', start: 1.00, end: 1.25 },
            { word: 'keeps', start: 1.25, end: 1.55 },
            { word: 'knitting', start: 1.55, end: 2.00 }
          ]
        }
      ];
    }

    // Generate clean reference keyframe stills (00:00 and 00:01) for demo mode without external URLs
    function generateReferenceKeyframeDataUrl(shotIdx) {
      const c = document.createElement('canvas');
      c.width = 360;
      c.height = 640;
      const ctx = c.getContext('2d');

      // Brick wall background
      ctx.fillStyle = '#a78349';
      ctx.fillRect(0, 0, 360, 420);
      ctx.strokeStyle = '#654b25';
      ctx.lineWidth = 2;
      for (let row = 0; row < 16; row++) {
        const y = row * 26;
        const offset = (row % 2) * 28;
        for (let col = -1; col < 8; col++) {
          ctx.strokeRect(col * 56 + offset, y, 56, 26);
        }
      }

      // Arched doorway
      const archGrad = ctx.createLinearGradient(170, 90, 320, 420);
      archGrad.addColorStop(0, '#c8d1db');
      archGrad.addColorStop(1, '#e8edf2');
      ctx.fillStyle = archGrad;
      ctx.beginPath();
      ctx.moveTo(175, 420);
      ctx.lineTo(175, 195);
      ctx.arc(248, 195, 73, Math.PI, 0, false);
      ctx.lineTo(321, 420);
      ctx.closePath();
      ctx.fill();

      // Cobblestone floor
      ctx.fillStyle = '#8b837c';
      ctx.fillRect(0, 420, 360, 220);
      for (let r = 0; r < 10; r++) {
        const py = 428 + r * 22;
        const rx = 14 + r * 2.2;
        const ry = 6 + r * 0.9;
        for (let cx = (r % 2) * 18; cx < 380; cx += rx * 2.1) {
          ctx.fillStyle = (cx + r) % 3 === 0 ? '#a79e95' : '#736b64';
          ctx.beginPath();
          ctx.ellipse(cx, py, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#4e4842';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      // Stamp reference keyframe indicator
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.fillRect(12, 12, 145, 28);
      ctx.fillStyle = '#f8fafc';
      ctx.font = '600 12px Inter, sans-serif';
      ctx.fillText(`Ref Keyframe #${shotIdx + 1} (${shotIdx}.0s)`, 20, 30);

      // Caption preview
      ctx.font = '800 22px Inter, sans-serif';
      ctx.textAlign = 'center';
      const cap = shotIdx === 0 ? 'she just' : 'just keeps knitting';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 5;
      ctx.strokeText(cap, 180, 565);
      ctx.fillStyle = '#fff';
      ctx.fillText(cap, 180, 565);

      return c.toDataURL('image/png');
    }

    /* =========================================================================
       3. BUILT-IN HIGH-DETAIL GRANDMA PARTS SHEET GENERATOR (#FF00FF CHROMA)
       ========================================================================= */
    // Generates a clean 1024x1024 #FF00FF parts sheet matching the Grandma character design
    // so Stage 5 Auto-Cut, Masking, White Sticker Halo, and Pivot Rigging can run immediately
    // even without an external image file or API quota.
    function generateBuiltInGrandmaPartsSheet() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Pure flat solid magenta #FF00FF background (no gradient, no shadow)
      ctx.fillStyle = '#FF00FF';
      ctx.fillRect(0, 0, 1024, 1024);

      const outline = '#3a2418';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      function strokeFill(fill, lw = 4.5) {
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = outline;
        ctx.lineWidth = lw;
        ctx.stroke();
      }

      // -----------------------------------------------------------------------
      // PIECE 1: HEAD + BUN + GLASSES + NECK STUB (Top-Left: x=40..340, y=30..365)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(190, 205);

      // Neck stub at bottom
      ctx.beginPath();
      ctx.moveTo(-26, 95);
      ctx.lineTo(-24, 134);
      ctx.bezierCurveTo(-24, 148, 24, 148, 24, 134);
      ctx.lineTo(26, 95);
      ctx.closePath();
      strokeFill('#f6c39c', 4.5);

      // Hair bun on top
      ctx.beginPath();
      ctx.ellipse(0, -124, 52, 38, 0, 0, Math.PI * 2);
      strokeFill('#e8e7e3', 4.5);
      ctx.beginPath();
      ctx.moveTo(-22, -148);
      ctx.quadraticCurveTo(-10, -124, -18, -96);
      ctx.moveTo(20, -148);
      ctx.quadraticCurveTo(10, -124, 18, -96);
      ctx.strokeStyle = '#b9b7b0';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Ears
      ctx.beginPath();
      ctx.ellipse(-114, 6, 16, 22, -0.15, 0, Math.PI * 2);
      strokeFill('#f6c39c', 4.5);
      ctx.beginPath();
      ctx.ellipse(114, 6, 16, 22, 0.15, 0, Math.PI * 2);
      strokeFill('#f6c39c', 4.5);

      // Main round face
      ctx.beginPath();
      ctx.ellipse(0, 6, 112, 102, 0, 0, Math.PI * 2);
      strokeFill('#fbd0ae', 5);

      // Grey hair cap
      ctx.beginPath();
      ctx.moveTo(-110, 4);
      ctx.bezierCurveTo(-116, -72, -56, -104, 0, -104);
      ctx.bezierCurveTo(56, -104, 116, -72, 110, 4);
      ctx.bezierCurveTo(96, -34, 42, -52, 0, -68);
      ctx.bezierCurveTo(-42, -52, -96, -34, -110, 4);
      ctx.closePath();
      strokeFill('#e8e7e3', 4.5);

      // Eyebrows
      ctx.beginPath();
      ctx.ellipse(-46, -34, 16, 6, -0.15, 0, Math.PI * 2);
      strokeFill('#e8e7e3', 3);
      ctx.beginPath();
      ctx.ellipse(46, -34, 16, 6, 0.15, 0, Math.PI * 2);
      strokeFill('#e8e7e3', 3);

      // Sleepy eyes
      [-44, 44].forEach((ex) => {
        ctx.beginPath();
        ctx.ellipse(ex, -8, 22, 18, 0, 0, Math.PI * 2);
        strokeFill('#ffffff', 3.5);

        // Pupil
        ctx.beginPath();
        ctx.arc(ex, -5, 7.5, 0, Math.PI * 2);
        ctx.fillStyle = '#3a2418';
        ctx.fill();

        // Droopy eyelid
        ctx.beginPath();
        ctx.ellipse(ex, -13, 22, 11, 0, Math.PI, 0, false);
        ctx.closePath();
        strokeFill('#f5be95', 3.2);
      });

      // Rosy cheeks
      ctx.fillStyle = 'rgba(240, 120, 120, 0.55)';
      ctx.beginPath();
      ctx.ellipse(-68, 26, 22, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(68, 26, 22, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Gold-rimmed round glasses
      ctx.strokeStyle = '#c89b2b';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.arc(-24, 14, 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(24, 14, 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-8, 12);
      ctx.quadraticCurveTo(0, 7, 8, 12);
      ctx.stroke();

      // Nose & gentle smile
      ctx.beginPath();
      ctx.arc(0, 18, 9, 0.15 * Math.PI, 0.95 * Math.PI);
      strokeFill('#f2b185', 3.5);

      ctx.beginPath();
      ctx.moveTo(-30, 44);
      ctx.quadraticCurveTo(0, 62, 30, 44);
      ctx.strokeStyle = '#7c4734';
      ctx.lineWidth = 3.5;
      ctx.stroke();
      ctx.restore();

      // -----------------------------------------------------------------------
      // PIECE 2: TORSO (Teal Coat + Gold Trim + Cream Apron) (Top-Center: x=380..680, y=45..455)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(530, 255);

      // Teal coat silhouette
      ctx.beginPath();
      ctx.moveTo(-72, -195);
      ctx.bezierCurveTo(-105, -145, -135, 35, -142, 175);
      ctx.quadraticCurveTo(0, 202, 142, 175);
      ctx.bezierCurveTo(135, 35, 105, -145, 72, -195);
      ctx.quadraticCurveTo(0, -162, -72, -195);
      ctx.closePath();
      strokeFill('#3b7c6d', 5);

      // Gold bottom hem band
      ctx.beginPath();
      ctx.moveTo(-140, 156);
      ctx.quadraticCurveTo(0, 182, 140, 156);
      ctx.lineTo(142, 175);
      ctx.quadraticCurveTo(0, 202, -142, 175);
      ctx.closePath();
      strokeFill('#d4ab42', 4);

      // Cream apron
      ctx.beginPath();
      ctx.moveTo(-88, -28);
      ctx.bezierCurveTo(-104, 42, -104, 112, -88, 142);
      ctx.quadraticCurveTo(0, 158, 88, 142);
      ctx.bezierCurveTo(104, 112, 104, 42, 88, -28);
      ctx.closePath();
      strokeFill('#f3eedc', 4.5);

      // Apron waistband
      ctx.beginPath();
      ctx.moveTo(-94, -36);
      ctx.quadraticCurveTo(0, -24, 94, -36);
      ctx.lineTo(90, -20);
      ctx.quadraticCurveTo(0, -8, -90, -20);
      ctx.closePath();
      strokeFill('#f3eedc', 4);

      // Center gold placket & collar trim
      ctx.fillStyle = '#d4ab42';
      ctx.fillRect(-6, -172, 12, 140);
      ctx.strokeStyle = outline;
      ctx.lineWidth = 3.5;
      ctx.strokeRect(-6, -172, 12, 140);

      // Gold collar border + knot
      ctx.beginPath();
      ctx.moveTo(-72, -192);
      ctx.quadraticCurveTo(0, -155, 72, -192);
      ctx.strokeStyle = '#d4ab42';
      ctx.lineWidth = 9;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-11, -172, 11, 7, -0.2, 0, Math.PI * 2);
      strokeFill('#d4ab42', 3.5);
      ctx.beginPath();
      ctx.ellipse(11, -172, 11, 7, 0.2, 0, Math.PI * 2);
      strokeFill('#d4ab42', 3.5);

      // Gold chest embroidery swirls
      ctx.strokeStyle = '#d4ab42';
      ctx.lineWidth = 3.5;
      [-1, 1].forEach((dir) => {
        ctx.beginPath();
        ctx.moveTo(dir * 20, -110);
        ctx.bezierCurveTo(dir * 62, -112, dir * 72, -148, dir * 48, -152);
        ctx.moveTo(dir * 24, -92);
        ctx.bezierCurveTo(dir * 75, -90, dir * 82, -120, dir * 64, -125);
        ctx.stroke();
      });

      ctx.restore();

      // -----------------------------------------------------------------------
      // PIECE 3: LEFT ARM + HAND (Top-Right: x=730..850, y=75..375)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(790, 215);
      ctx.beginPath();
      ctx.moveTo(18, -125);
      ctx.bezierCurveTo(-36, -90, -45, 25, -18, 92);
      ctx.lineTo(24, 84);
      ctx.bezierCurveTo(8, 22, 16, -65, 42, -108);
      ctx.closePath();
      strokeFill('#3b7c6d', 4.5);

      // Gold cuff
      ctx.beginPath();
      ctx.rect(-20, 82, 46, 15);
      strokeFill('#d4ab42', 4);

      // Curled hand
      ctx.beginPath();
      ctx.ellipse(6, 114, 24, 20, 0.1, 0, Math.PI * 2);
      strokeFill('#fbd0ae', 4.5);
      ctx.restore();

      // -----------------------------------------------------------------------
      // PIECE 4: RIGHT ARM + HAND (Far Top-Right: x=875..995, y=75..375)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(935, 215);
      ctx.beginPath();
      ctx.moveTo(-18, -125);
      ctx.bezierCurveTo(36, -90, 45, 25, 18, 92);
      ctx.lineTo(-24, 84);
      ctx.bezierCurveTo(-8, 22, -16, -65, -42, -108);
      ctx.closePath();
      strokeFill('#3b7c6d', 4.5);

      // Gold cuff
      ctx.beginPath();
      ctx.rect(-26, 82, 46, 15);
      strokeFill('#d4ab42', 4);

      // Curled hand
      ctx.beginPath();
      ctx.ellipse(-6, 114, 24, 20, -0.1, 0, Math.PI * 2);
      strokeFill('#fbd0ae', 4.5);
      ctx.restore();

      // -----------------------------------------------------------------------
      // PIECE 5: KNITTING NEEDLES PROP (Bottom-Left: x=60..240, y=540..920)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(150, 730);
      [-34, 34].forEach((nx) => {
        ctx.fillStyle = '#c88c46';
        ctx.strokeStyle = outline;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(nx - 5, -145, 10, 290, 5);
        ctx.fill();
        ctx.stroke();

        // Orange wooden ball tip
        ctx.beginPath();
        ctx.arc(nx, -152, 16, 0, Math.PI * 2);
        strokeFill('#e57a1c', 4);

        ctx.beginPath();
        ctx.arc(nx, 152, 13, 0, Math.PI * 2);
        strokeFill('#e57a1c', 4);
      });
      ctx.restore();

      // -----------------------------------------------------------------------
      // PIECE 6: HANGING KNITTED SCARF PROP (Bottom-Center-Left: x=310..440, y=535..925)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(375, 730);
      ctx.beginPath();
      ctx.moveTo(-32, -165);
      ctx.bezierCurveTo(-24, -40, -40, 60, -34, 150);
      ctx.lineTo(34, 150);
      ctx.bezierCurveTo(28, 60, 42, -40, 32, -165);
      ctx.closePath();
      strokeFill('#c82b2b', 4.5);

      // Yellow stripes near bottom
      ctx.fillStyle = '#e5b82e';
      ctx.fillRect(-33, 98, 66, 11);
      ctx.fillRect(-34, 120, 68, 11);

      // Knit stitch dashes
      ctx.strokeStyle = '#7e1717';
      ctx.lineWidth = 2.5;
      for (let sy = -140; sy <= 80; sy += 22) {
        ctx.beginPath();
        ctx.moveTo(-14, sy);
        ctx.lineTo(-14, sy + 10);
        ctx.moveTo(0, sy + 6);
        ctx.lineTo(0, sy + 16);
        ctx.moveTo(14, sy);
        ctx.lineTo(14, sy + 10);
        ctx.stroke();
      }

      // Fringe
      ctx.strokeStyle = outline;
      ctx.lineWidth = 3.5;
      for (let fx = -26; fx <= 26; fx += 10) {
        ctx.beginPath();
        ctx.moveTo(fx, 150);
        ctx.lineTo(fx, 174);
        ctx.stroke();
      }
      ctx.restore();

      // -----------------------------------------------------------------------
      // PIECE 7: LEFT LEG + SHOE (Bottom-Center-Right: x=545..675, y=575..925)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(615, 755);
      ctx.beginPath();
      ctx.moveTo(-26, -155);
      ctx.bezierCurveTo(-34, -175, 34, -175, 26, -155);
      ctx.lineTo(22, 125);
      ctx.lineTo(-22, 125);
      ctx.closePath();
      strokeFill('#7c6e5b', 4.5);

      // Dark shoe facing left
      ctx.beginPath();
      ctx.moveTo(22, 125);
      ctx.lineTo(24, 148);
      ctx.quadraticCurveTo(-20, 154, -56, 148);
      ctx.quadraticCurveTo(-58, 130, -22, 125);
      ctx.closePath();
      strokeFill('#3f3d36', 4.5);
      ctx.restore();

      // -----------------------------------------------------------------------
      // PIECE 8: RIGHT LEG + SHOE (Bottom-Right: x=745..875, y=575..925)
      // -----------------------------------------------------------------------
      ctx.save();
      ctx.translate(805, 755);
      ctx.beginPath();
      ctx.moveTo(-26, -155);
      ctx.bezierCurveTo(-34, -175, 34, -175, 26, -155);
      ctx.lineTo(22, 125);
      ctx.lineTo(-22, 125);
      ctx.closePath();
      strokeFill('#7c6e5b', 4.5);

      // Dark shoe facing right
      ctx.beginPath();
      ctx.moveTo(-22, 125);
      ctx.lineTo(-24, 148);
      ctx.quadraticCurveTo(20, 154, 56, 148);
      ctx.quadraticCurveTo(58, 130, 22, 125);
      ctx.closePath();
      strokeFill('#3f3d36', 4.5);
      ctx.restore();

      return canvas.toDataURL('image/png');
    }

    /* =========================================================================
       4. STAGE 5: MAGENTA CHROMA-KEY, CONNECTED COMPONENTS & WHITE STICKER HALO
       ========================================================================= */
    async function runAutoCutPipeline(sheetDataUrl, tolerance = 95, haloRadius = 6) {
      const img = await loadImage(sheetDataUrl);
      const w = img.width;
      const h = img.height;

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = w;
      srcCanvas.height = h;
      const srcCtx = srcCanvas.getContext('2d');
      srcCtx.drawImage(img, 0, 0);
      const imgData = srcCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // 1. Chroma key magenta (#FF00FF -> R=255, G=0, B=255)
      const mask = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const idx = i * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];
        const a = data[idx + 3];

        // Distance from pure magenta (255, 0, 255)
        const dist = Math.sqrt((r - 255) ** 2 + g ** 2 + (b - 255) ** 2);
        if (a < 30 || dist <= tolerance) {
          data[idx + 3] = 0;
          mask[i] = 0;
        } else {
          // Soft edge feathering near threshold
          if (dist < tolerance + 22) {
            const alphaFactor = (dist - tolerance) / 22;
            data[idx + 3] = Math.round(a * alphaFactor);
          }
          mask[i] = 1;
        }
      }
      srcCtx.putImageData(imgData, 0, 0);

      // 2. Connected Components (BFS flood fill)
      const visited = new Uint8Array(w * h);
      const components = [];
      const queue = new Int32Array(w * h);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const startIdx = y * w + x;
          if (mask[startIdx] === 1 && visited[startIdx] === 0) {
            let head = 0;
            let tail = 0;
            queue[tail++] = startIdx;
            visited[startIdx] = 1;

            let minX = x, maxX = x, minY = y, maxY = y;
            let pixelCount = 0;
            const pixels = [];

            while (head < tail) {
              const curr = queue[head++];
              const cx = curr % w;
              const cy = (curr - cx) / w;
              pixels.push(curr);
              pixelCount++;

              if (cx < minX) minX = cx;
              if (cx > maxX) maxX = cx;
              if (cy < minY) minY = cy;
              if (cy > maxY) maxY = cy;

              // 4-connected neighbors
              const neighbors = [curr - 1, curr + 1, curr - w, curr + w];
              for (let n = 0; n < 4; n++) {
                const nIdx = neighbors[n];
                if (nIdx >= 0 && nIdx < w * h && visited[nIdx] === 0 && mask[nIdx] === 1) {
                  const nx = nIdx % w;
                  if (Math.abs(nx - cx) <= 1) {
                    visited[nIdx] = 1;
                    queue[tail++] = nIdx;
                  }
                }
              }
            }

            // Filter tiny speck noise (< 350 pixels)
            if (pixelCount >= 350) {
              components.push({
                minX, maxX, minY, maxY,
                width: maxX - minX + 1,
                height: maxY - minY + 1,
                centerX: (minX + maxX) / 2 / w,
                centerY: (minY + maxY) / 2 / h,
                pixelCount,
                pixels
              });
            }
          }
        }
      }

      // 3. Sort top-to-bottom, left-to-right and auto-assign anatomical roles + default pivots
      components.sort((a, b) => {
        const rowDiff = Math.floor(a.centerY * 3) - Math.floor(b.centerY * 3);
        return rowDiff !== 0 ? rowDiff : a.centerX - b.centerX;
      });

      const pieces = components.map((comp, idx) => {
        const role = inferPieceRole(comp, idx, components.length);
        const pad = haloRadius + 10;
        const cw = comp.width + pad * 2;
        const ch = comp.height + pad * 2;

        // Isolate only this component's pixels onto clean canvas
        const pieceCanvas = document.createElement('canvas');
        pieceCanvas.width = cw;
        pieceCanvas.height = ch;
        const pCtx = pieceCanvas.getContext('2d');
        const pieceImg = pCtx.createImageData(cw, ch);

        for (let i = 0; i < comp.pixels.length; i++) {
          const globalIdx = comp.pixels[i];
          const gx = globalIdx % w;
          const gy = (globalIdx - gx) / w;
          const lx = gx - comp.minX + pad;
          const ly = gy - comp.minY + pad;
          const lIdx = (ly * cw + lx) * 4;
          const gByte = globalIdx * 4;

          pieceImg.data[lIdx] = data[gByte];
          pieceImg.data[lIdx + 1] = data[gByte + 1];
          pieceImg.data[lIdx + 2] = data[gByte + 2];
          pieceImg.data[lIdx + 3] = data[gByte + 3];
        }
        pCtx.putImageData(pieceImg, 0, 0);

        // 4. Build White Sticker Halo texture via morphological dilation of alpha channel
        const haloCanvas = buildWhiteStickerHalo(pieceCanvas, haloRadius);

        // 5. Default normalized pivot (0..1) based on anatomical role
        const defaultPivot = getDefaultPivotForRole(role);

        return {
          id: `piece_${idx + 1}`,
          role,
          imageDataUrl: pieceCanvas.toDataURL('image/png'),
          haloDataUrl: haloCanvas.toDataURL('image/png'),
          width: cw,
          height: ch,
          pivotX: defaultPivot.x,
          pivotY: defaultPivot.y,
          bbox: { minX: comp.minX, minY: comp.minY, width: comp.width, height: comp.height }
        };
      });

      return pieces;
    }

    function inferPieceRole(comp, idx, total) {
      const { centerX, centerY, width, height } = comp;
      const aspect = width / Math.max(1, height);

      if (centerY < 0.48) {
        if (centerX < 0.36) return 'Head';
        if (centerX < 0.68) return 'Torso';
        return centerX < 0.86 ? 'LeftArm' : 'RightArm';
      } else {
        if (centerX < 0.28) return 'PropNeedles';
        if (centerX < 0.48) return 'PropScarf';
        return centerX < 0.72 ? 'LeftLeg' : 'RightLeg';
      }
    }

    function getDefaultPivotForRole(role) {
      switch (role) {
        case 'Head':        return { x: 0.50, y: 0.88 }; // Neck stub pivot
        case 'Torso':       return { x: 0.50, y: 0.50 }; // Center of mass
        case 'LeftArm':     return { x: 0.65, y: 0.14 }; // Left shoulder pivot
        case 'RightArm':    return { x: 0.35, y: 0.14 }; // Right shoulder pivot
        case 'LeftLeg':     return { x: 0.50, y: 0.10 }; // Left hip pivot
        case 'RightLeg':    return { x: 0.50, y: 0.10 }; // Right hip pivot
        case 'PropNeedles': return { x: 0.50, y: 0.50 };
        case 'PropScarf':   return { x: 0.50, y: 0.08 };
        default:            return { x: 0.50, y: 0.50 };
      }
    }

    function buildWhiteStickerHalo(pieceCanvas, radius) {
      const w = pieceCanvas.width;
      const h = pieceCanvas.height;
      const srcCtx = pieceCanvas.getContext('2d');
      const srcData = srcCtx.getImageData(0, 0, w, h).data;

      const haloCanvas = document.createElement('canvas');
      haloCanvas.width = w;
      haloCanvas.height = h;
      const hCtx = haloCanvas.getContext('2d');
      const outData = hCtx.createImageData(w, h);

      // Circular kernel dilation on alpha > 40
      const rSq = radius * radius;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let maxA = 0;
          const y0 = Math.max(0, y - radius);
          const y1 = Math.min(h - 1, y + radius);
          const x0 = Math.max(0, x - radius);
          const x1 = Math.min(w - 1, x + radius);

          for (let ny = y0; ny <= y1; ny++) {
            const dy = ny - y;
            for (let nx = x0; nx <= x1; nx++) {
              const dx = nx - x;
              if (dx * dx + dy * dy <= rSq) {
                const a = srcData[(ny * w + nx) * 4 + 3];
                if (a > maxA) {
                  maxA = a;
                  if (maxA === 255) break;
                }
              }
            }
            if (maxA === 255) break;
          }

          if (maxA > 20) {
            const idx = (y * w + x) * 4;
            outData.data[idx] = 255;
            outData.data[idx + 1] = 255;
            outData.data[idx + 2] = 255;
            outData.data[idx + 3] = maxA;
          }
        }
      }
      hCtx.putImageData(outData, 0, 0);

      // Also draw original cutout centered on top so combined sticker texture is crisp
      hCtx.drawImage(pieceCanvas, 0, 0);
      return haloCanvas;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    /* =========================================================================
       5. THREE.JS HYBRID 3D SCENE ENGINE (STAGES 6, 7 & 8)
       ========================================================================= */
    class HybridSceneEngine {
      constructor() {
        this.width = 720;
        this.height = 1280;

        this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        this.renderer.setSize(this.width, this.height, false);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.08;

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x1b1a18);
        this.scene.fog = new THREE.FogExp2(0x211e1a, 0.032);

        this.camera = new THREE.PerspectiveCamera(40, this.width / this.height, 0.1, 60);
        this.camera.position.set(0, 2.35, 5.4);
        this.camera.lookAt(0, 1.45, 0);

        this.rigNodes = {};
        this.scarfMesh = null;
        this.warmLight = null;
        this.archLight = null;

        this._buildLighting();
        this._buildCourtyardEnvironment();
      }

      _buildLighting() {
        const hemi = new THREE.HemisphereLight(0xfff4e0, 0x4b4239, 1.15);
        this.scene.add(hemi);

        // Warm flickering lantern point light
        this.warmLight = new THREE.PointLight(0xffb454, 2.6, 18, 1.4);
        this.warmLight.position.set(-1.35, 3.85, 2.2);
        this.warmLight.castShadow = true;
        this.warmLight.shadow.mapSize.width = 1024;
        this.warmLight.shadow.mapSize.height = 1024;
        this.warmLight.shadow.bias = -0.0005;
        this.scene.add(this.warmLight);

        // Soft daylight spill from arched doorway
        this.archLight = new THREE.DirectionalLight(0xdce8f8, 1.25);
        this.archLight.position.set(1.2, 4.2, -1.5);
        this.archLight.castShadow = true;
        this.scene.add(this.archLight);
      }

      _createBrickTextures() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');

        const b = document.createElement('canvas');
        b.width = 512;
        b.height = 512;
        const bCtx = b.getContext('2d');

        // Mortar
        ctx.fillStyle = '#4a371e';
        ctx.fillRect(0, 0, 512, 512);
        bCtx.fillStyle = '#202020';
        bCtx.fillRect(0, 0, 512, 512);

        const rows = 16;
        const cols = 6;
        const rh = 512 / rows;
        const cw = 512 / cols;

        for (let r = 0; r < rows; r++) {
          const offset = (r % 2) * (cw * 0.5);
          for (let col = -1; col <= cols; col++) {
            const bx = col * cw + offset + 3;
            const by = r * rh + 3;
            const bw = cw - 6;
            const bh = rh - 6;

            // Deterministic color variation per brick
            const shade = ((r * 7 + col * 13) % 5) * 4;
            ctx.fillStyle = `rgb(${158 + shade}, ${124 + shade}, ${66 + Math.floor(shade * 0.6)})`;
            ctx.fillRect(bx, by, bw, bh);

            bCtx.fillStyle = '#d8d8d8';
            bCtx.fillRect(bx, by, bw, bh);
          }
        }

        const colorTex = new THREE.CanvasTexture(c);
        colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
        colorTex.repeat.set(2.4, 2.2);
        colorTex.colorSpace = THREE.SRGBColorSpace;

        const bumpTex = new THREE.CanvasTexture(b);
        bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
        bumpTex.repeat.set(2.4, 2.2);

        return { colorTex, bumpTex };
      }

      _createCobblestoneTextures() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');

        const b = document.createElement('canvas');
        b.width = 512;
        b.height = 512;
        const bCtx = b.getContext('2d');

        ctx.fillStyle = '#3d3732';
        ctx.fillRect(0, 0, 512, 512);
        bCtx.fillStyle = '#181818';
        bCtx.fillRect(0, 0, 512, 512);

        const grid = 12;
        const step = 512 / grid;
        for (let gy = 0; gy < grid; gy++) {
          for (let gx = 0; gx < grid; gx++) {
            const jx = Math.sin(gx * 12.9898 + gy * 78.233) * 6;
            const jy = Math.cos(gx * 39.346 + gy * 11.135) * 6;
            const cx = (gx + 0.5) * step + jx;
            const cy = (gy + 0.5) * step + jy;
            const rx = step * 0.39;
            const ry = step * 0.33;

            const tone = 118 + ((gx * 17 + gy * 31) % 36);
            ctx.fillStyle = `rgb(${tone + 10}, ${tone + 4}, ${tone - 2})`;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, (gx + gy) * 0.2, 0, Math.PI * 2);
            ctx.fill();

            bCtx.fillStyle = '#e5e5e5';
            bCtx.beginPath();
            bCtx.ellipse(cx, cy, rx * 0.92, ry * 0.92, (gx + gy) * 0.2, 0, Math.PI * 2);
            bCtx.fill();
          }
        }

        const colorTex = new THREE.CanvasTexture(c);
        colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
        colorTex.repeat.set(3.5, 4.5);
        colorTex.colorSpace = THREE.SRGBColorSpace;

        const bumpTex = new THREE.CanvasTexture(b);
        bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
        bumpTex.repeat.set(3.5, 4.5);

        return { colorTex, bumpTex };
      }

      _buildCourtyardEnvironment() {
        const { colorTex: brickColor, bumpTex: brickBump } = this._createBrickTextures();
        const { colorTex: cobbleColor, bumpTex: cobbleBump } = this._createCobblestoneTextures();

        // 1. Perspective cobblestone floor
        const floorGeo = new THREE.PlaneGeometry(10, 12);
        const floorMat = new THREE.MeshStandardMaterial({
          map: cobbleColor,
          bumpMap: cobbleBump,
          bumpScale: 0.08,
          roughness: 0.85,
          metalness: 0.05
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0, 1.5);
        floor.receiveShadow = true;
        this.scene.add(floor);

        // 2. Brick wall with extruded arched doorway cutout
        const wallShape = new THREE.Shape();
        wallShape.moveTo(-4.5, 0);
        wallShape.lineTo(4.5, 0);
        wallShape.lineTo(4.5, 6.2);
        wallShape.lineTo(-4.5, 6.2);
        wallShape.closePath();

        // Arched doorway hole on the right side
        const archHole = new THREE.Path();
        const ax = 0.72;
        const aw = 0.92;
        const archSpringY = 2.55;
        archHole.moveTo(ax - aw, 0);
        archHole.lineTo(ax - aw, archSpringY);
        archHole.absarc(ax, archSpringY, aw, Math.PI, 0, true);
        archHole.lineTo(ax + aw, 0);
        archHole.closePath();
        wallShape.holes.push(archHole);

        const wallGeo = new THREE.ExtrudeGeometry(wallShape, {
          depth: 0.45,
          bevelEnabled: false
        });
        // Normalize UVs for brick tiling
        const pos = wallGeo.attributes.position;
        const uv = wallGeo.attributes.uv;
        for (let i = 0; i < pos.count; i++) {
          uv.setXY(i, (pos.getX(i) + 4.5) / 9.0, pos.getY(i) / 6.2);
        }

        const wallMat = new THREE.MeshStandardMaterial({
          map: brickColor,
          bumpMap: brickBump,
          bumpScale: 0.06,
          roughness: 0.82
        });
        const wallMesh = new THREE.Mesh(wallGeo, wallMat);
        wallMesh.position.set(0, 0, -1.15);
        wallMesh.receiveShadow = true;
        wallMesh.castShadow = true;
        this.scene.add(wallMesh);

        // Soft glowing archway backdrop behind opening
        const backdropCanvas = document.createElement('canvas');
        backdropCanvas.width = 256;
        backdropCanvas.height = 512;
        const bCtx = backdropCanvas.getContext('2d');
        const grad = bCtx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#a6b5c6');
        grad.addColorStop(0.55, '#d5dde6');
        grad.addColorStop(1, '#eef2f6');
        bCtx.fillStyle = grad;
        bCtx.fillRect(0, 0, 256, 512);

        const backdropTex = new THREE.CanvasTexture(backdropCanvas);
        backdropTex.colorSpace = THREE.SRGBColorSpace;
        const backdrop = new THREE.Mesh(
          new THREE.PlaneGeometry(3.2, 4.8),
          new THREE.MeshBasicMaterial({ map: backdropTex })
        );
        backdrop.position.set(0.72, 2.2, -1.35);
        this.scene.add(backdrop);
      }

      async assembleCharacterRig(pieces) {
        // Remove previous character rig if present
        if (this.rigNodes.root) {
          this.scene.remove(this.rigNodes.root);
        }
        this.rigNodes = {};

        const root = new THREE.Group();
        root.position.set(-0.08, 0.0, 0.05);
        this.scene.add(root);
        this.rigNodes.root = root;

        // Soft ground contact shadow under shoes
        const shadowCanvas = document.createElement('canvas');
        shadowCanvas.width = 128;
        shadowCanvas.height = 64;
        const sCtx = shadowCanvas.getContext('2d');
        const sGrad = sCtx.createRadialGradient(64, 32, 6, 64, 32, 58);
        sGrad.addColorStop(0, 'rgba(0,0,0,0.52)');
        sGrad.addColorStop(1, 'rgba(0,0,0,0)');
        sCtx.fillStyle = sGrad;
        sCtx.fillRect(0, 0, 128, 64);
        const shadowTex = new THREE.CanvasTexture(shadowCanvas);

        const contactShadow = new THREE.Mesh(
          new THREE.PlaneGeometry(1.35, 0.55),
          new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
        );
        contactShadow.rotation.x = -Math.PI / 2;
        contactShadow.position.set(0, 0.006, 0.02);
        root.add(contactShadow);

        // Helper to build a pivot-aligned textured cutout plane with white sticker halo
        const buildPartGroup = async (piece, worldHeight, zOffset) => {
          if (!piece) return null;
          const tex = await new THREE.TextureLoader().loadAsync(piece.haloDataUrl);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.minFilter = THREE.LinearFilter;

          const aspect = piece.width / Math.max(1, piece.height);
          const worldW = worldHeight * aspect;

          const geo = new THREE.PlaneGeometry(worldW, worldHeight);
          // Shift geometry vertices so (0, 0, 0) sits right on the user's pivot crosshair!
          const offsetX = (0.5 - piece.pivotX) * worldW;
          const offsetY = (piece.pivotY - 0.5) * worldHeight;
          geo.translate(offsetX, offsetY, 0);

          const mat = new THREE.MeshStandardMaterial({
            map: tex,
            transparent: true,
            alphaTest: 0.12,
            roughness: 0.72,
            metalness: 0.02,
            side: THREE.DoubleSide
          });

          const mesh = new THREE.Mesh(geo, mat);
          mesh.castShadow = true;

          const group = new THREE.Group();
          group.position.z = zOffset;
          group.add(mesh);
          return group;
        };

        const byRole = {};
        for (const p of pieces) byRole[p.role] = p;

        // Torso hub
        const torso = await buildPartGroup(byRole.Torso, 1.38, 0.0);
        if (torso) {
          torso.position.set(0, 1.24, 0.0);
          root.add(torso);
          this.rigNodes.torso = torso;
        }

        const parentHub = torso || root;
        const hubOffsetY = torso ? 0 : 1.24;

        // Head attached at neck pivot
        const head = await buildPartGroup(byRole.Head, 1.18, 0.03);
        if (head) {
          head.position.set(0, 0.56 + hubOffsetY, 0.03);
          parentHub.add(head);
          this.rigNodes.head = head;
        }

        // Legs attached at hip pivots
        const leftLeg = await buildPartGroup(byRole.LeftLeg, 0.88, -0.025);
        if (leftLeg) {
          leftLeg.position.set(-0.22, -0.44 + hubOffsetY, -0.025);
          parentHub.add(leftLeg);
          this.rigNodes.leftLeg = leftLeg;
        }

        const rightLeg = await buildPartGroup(byRole.RightLeg, 0.88, -0.025);
        if (rightLeg) {
          rightLeg.position.set(0.22, -0.44 + hubOffsetY, -0.025);
          parentHub.add(rightLeg);
          this.rigNodes.rightLeg = rightLeg;
        }

        // Arms attached at shoulder pivots
        const leftArm = await buildPartGroup(byRole.LeftArm, 0.92, 0.02);
        if (leftArm) {
          leftArm.position.set(-0.34, 0.42 + hubOffsetY, 0.02);
          leftArm.rotation.z = 0.28;
          parentHub.add(leftArm);
          this.rigNodes.leftArm = leftArm;
        }

        const rightArm = await buildPartGroup(byRole.RightArm, 0.92, 0.02);
        if (rightArm) {
          rightArm.position.set(0.34, 0.42 + hubOffsetY, 0.02);
          rightArm.rotation.z = -0.28;
          parentHub.add(rightArm);
          this.rigNodes.rightArm = rightArm;
        }

        // Crossed knitting needles prop in front of apron
        const needles = await buildPartGroup(byRole.PropNeedles, 0.85, 0.045);
        if (needles) {
          needles.position.set(-0.02, -0.06 + hubOffsetY, 0.045);
          needles.rotation.z = 0.12;
          parentHub.add(needles);
          this.rigNodes.needles = needles;
        }

        // Hanging knitted scarf tail from needles down to floor
        const scarfProp = await buildPartGroup(byRole.PropScarf, 0.88, 0.04);
        if (scarfProp) {
          scarfProp.position.set(-0.04, -0.04 + hubOffsetY, 0.04);
          parentHub.add(scarfProp);
          this.rigNodes.scarfProp = scarfProp;
        }
      }

      _createScarfStripeTexture() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 128;
        const ctx = c.getContext('2d');

        // Rich knitted red wool base with yellow center stripes
        ctx.fillStyle = '#c82424';
        ctx.fillRect(0, 0, 256, 128);

        ctx.fillStyle = '#e7b928';
        ctx.fillRect(0, 44, 256, 14);
        ctx.fillRect(0, 70, 256, 14);

        // Knit stitch texture lines
        ctx.strokeStyle = 'rgba(90, 12, 12, 0.45)';
        ctx.lineWidth = 3;
        for (let x = 0; x < 256; x += 14) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + 6, 128);
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(16, 1);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      _update3DScarfMesh(growthProgress) {
        if (this.scarfMesh) {
          this.scene.remove(this.scarfMesh);
          this.scarfMesh.geometry.dispose();
          this.scarfMesh = null;
        }
        if (growthProgress <= 0.01) return;

        // S-curve growing from Grandma's hanging scarf across the cobblestone floor toward foreground
        const fullPoints = [
          new THREE.Vector3(-0.10, 0.36, 0.14),
          new THREE.Vector3(-0.11, 0.07, 0.42),
          new THREE.Vector3(-0.22, 0.055, 1.05),
          new THREE.Vector3(0.14, 0.055, 1.85),
          new THREE.Vector3(-0.12, 0.055, 2.75),
          new THREE.Vector3(0.28, 0.055, 3.65),
          new THREE.Vector3(0.62, 0.055, 4.45)
        ];

        const fullCurve = new THREE.CatmullRomCurve3(fullPoints);
        const sampleCount = Math.max(6, Math.round(48 * growthProgress));
        const subPoints = [];
        for (let i = 0; i <= sampleCount; i++) {
          const u = (i / sampleCount) * growthProgress;
          subPoints.push(fullCurve.getPoint(u));
        }

        const activeCurve = new THREE.CatmullRomCurve3(subPoints);
        const tubeGeo = new THREE.TubeGeometry(activeCurve, Math.max(8, sampleCount * 2), 0.11, 12, false);
        // Flatten slightly so it rests like a thick knitted wool ribbon on cobblestones
        tubeGeo.scale(1.25, 0.42, 1.0);

        if (!this.scarfMat) {
          this.scarfMat = new THREE.MeshStandardMaterial({
            map: this._createScarfStripeTexture(),
            roughness: 0.85,
            metalness: 0.02
          });
        }

        this.scarfMesh = new THREE.Mesh(tubeGeo, this.scarfMat);
        this.scarfMesh.castShadow = true;
        this.scarfMesh.receiveShadow = true;
        this.scene.add(this.scarfMesh);
      }

      // Pure deterministic evaluation at timestamp t (no Math.random, no Date.now)
      evaluateAtTime(t, timelineCfg, shotList) {
        const clampedT = Math.max(0, Math.min(timelineCfg.duration, t));
        const normT = clampedT / Math.max(0.001, timelineCfg.duration);

        // 1. Deterministic warm lantern flicker (sum of sines)
        if (this.warmLight) {
          const flicker =
            Math.sin(clampedT * 11.3) * 0.6 +
            Math.sin(clampedT * 23.7 + 1.1) * 0.4;
          this.warmLight.intensity = timelineCfg.lightBaseIntensity + flicker * timelineCfg.lightFlickerAmp;
        }

        // 2. Character hierarchical rig animation
        if (this.rigNodes.torso) {
          const bob = Math.sin(clampedT * Math.PI * 2 * timelineCfg.bodyBobFreq) * timelineCfg.bodyBobAmp;
          this.rigNodes.torso.position.y = 1.24 + bob;
        }
        if (this.rigNodes.head) {
          this.rigNodes.head.rotation.z =
            Math.sin(clampedT * Math.PI * 2 * timelineCfg.headTiltFreq) * timelineCfg.headTiltAmp;
        }
        if (this.rigNodes.leftArm) {
          const swing = Math.sin(clampedT * Math.PI * 2 * timelineCfg.armSwingFreq) * timelineCfg.armSwingAmp;
          this.rigNodes.leftArm.rotation.z = 0.28 + swing;
        }
        if (this.rigNodes.rightArm) {
          const swing = Math.sin(clampedT * Math.PI * 2 * timelineCfg.armSwingFreq + Math.PI) * timelineCfg.armSwingAmp;
          this.rigNodes.rightArm.rotation.z = -0.28 + swing;
        }
        if (this.rigNodes.needles) {
          this.rigNodes.needles.rotation.z =
            0.12 + Math.sin(clampedT * Math.PI * 2 * timelineCfg.armSwingFreq) * 0.08;
        }

        // 3. 3D knitted scarf growth across cobblestone floor
        const scarfSpan = Math.max(0.05, timelineCfg.scarfEndT - timelineCfg.scarfStartT);
        const rawScarfP = Math.max(0, Math.min(1, (clampedT - timelineCfg.scarfStartT) / scarfSpan));
        // Smooth cubic ease-out
        const easedScarfP = 1 - Math.pow(1 - rawScarfP, 3);
        this._update3DScarfMesh(easedScarfP);

        // 4. Camera keyframe interpolation
        const easeCam = normT < 0.5 ? 2 * normT * normT : 1 - Math.pow(-2 * normT + 2, 2) / 2;
        const camZ = timelineCfg.cameraZoomStart + (timelineCfg.cameraZoomEnd - timelineCfg.cameraZoomStart) * easeCam;
        const camY = 2.35 - 0.14 * easeCam;
        this.camera.position.set(0, camY, camZ);
        this.camera.lookAt(0, 1.32 - 0.18 * easeCam, 0.35 * easeCam);

        this.renderer.render(this.scene, this.camera);
        return this.renderer.domElement;
      }
    }

    let engine = null;
    function getEngine() {
      if (!engine) {
        engine = new HybridSceneEngine();
      }
      return engine;
    }

    // Composite Three.js WebGL frame + burned-in bold white word-by-word captions onto target 2D canvas
    function renderCompositeFrame(targetCanvas, t) {
      const eng = getEngine();
      const webglCanvas = eng.evaluateAtTime(t, state.timelineConfig, state.shotList);

      const ctx = targetCanvas.getContext('2d');
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      ctx.drawImage(webglCanvas, 0, 0, targetCanvas.width, targetCanvas.height);

      // Find active shot & word-by-word caption phrase at time t
      const activeShot =
        state.shotList.find((s) => t >= s.start && t <= s.end) ||
        state.shotList[state.shotList.length - 1];

      if (activeShot && Array.isArray(activeShot.captions) && activeShot.captions.length > 0) {
        // Show cumulative spoken words up to current timestamp t within the shot
        const spokenWords = activeShot.captions
          .filter((w) => t >= w.start)
          .map((w) => w.word);

        const captionText = spokenWords.join(' ').trim();
        if (captionText) {
          ctx.save();
          ctx.font = '800 54px Inter, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const x = targetCanvas.width / 2;
          const y = targetCanvas.height - 235;

          // Bold black outline + drop shadow matching reference style
          ctx.shadowColor = 'rgba(0,0,0,0.85)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 4;
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 13;
          ctx.lineJoin = 'round';
          ctx.strokeText(captionText, x, y);

          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText(captionText, x, y);
          ctx.restore();
        }
      }
    }

    /* =========================================================================
       6. GEMINI API INTEGRATION (STAGE 2 SHOT LIST & STAGE 4 PARTS SHEET)
       ========================================================================= */
    async function callGeminiShotAnalysis() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const prompt = `Analyze this vertical 9:16 short video scene ("${state.videoMeta.name}", duration ${state.videoMeta.duration.toFixed(1)}s) and return a strict JSON array of shots.
Each shot object must follow this schema:
[{
  "start": number,
  "end": number,
  "camera": { "movement": string, "angle": string },
  "environment": { "surfaces": string, "lighting": string, "props": string },
  "characters": [{ "name": string, "pose": string, "action": string }],
  "captions": [{ "word": string, "start": number, "end": number }]
}]`;

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: 'application/json'
        }
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`Gemini API HTTP ${res.status}`);
      const json = await res.json();
      const rawText = json?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error('Empty response from Gemini');
      return JSON.parse(rawText);
    }

    async function callGeminiPartsSheet(characterName, keyframeDataUrl) {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

      const promptText = `Character rig parts sheet for "${characterName}" matching the attached reference keyframe: separate pieces laid out in a clean grid with wide empty gaps so no piece touches or overlaps another. All pieces at the same scale:
1. HEAD with hair/hat and short neck stub at bottom.
2. TORSO with NO arms (shoulders left open).
3. LEFT ARM + HAND.
4. RIGHT ARM + HAND.
5. PROPS (knitting needles, scarf strip).
6. LEFT LEG + SHOE.
7. RIGHT LEG + SHOE.
Flat 2D paper-cutout cartoon style, thin dark brown outline, flat #FF00FF solid magenta background, no gradient, no cast shadow, no text, no labels.`;

      const parts = [{ text: promptText }];
      if (keyframeDataUrl && keyframeDataUrl.startsWith('data:image/')) {
        const base64 = keyframeDataUrl.split(',')[1];
        parts.push({
          inlineData: { mimeType: 'image/png', data: base64 }
        });
      }

      const payload = {
        contents: [{ role: 'user', parts }],
        generationConfig: {
          responseModalities: ['IMAGE'],
          imageConfig: { aspectRatio: '1:1' }
        }
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`Image API HTTP ${res.status}`);
      const json = await res.json();
      const imgPart = json?.candidates?.[0]?.content?.parts?.find((p) => p.inlineData);
      if (!imgPart) throw new Error('No image returned by model');
      return `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 4200);
    }

    function stopPlayback() {
      state.isPlaying = false;
    }

    function goToStage(stageId) {
      // Enforce strict gating: can only visit stage 1, already approved stages, or the immediate next stage after highest approved
      const maxUnlocked = Math.min(8, state.approvedStages.size + 1);
      if (stageId > maxUnlocked) {
        showToast(`Stage ${stageId} is locked. Please complete and approve Stage ${maxUnlocked} first.`);
        return;
      }
      stopPlayback();
      state.currentStage = stageId;
      renderApp();
    }

    function approveCurrentStage() {
      const s = state.currentStage;
      state.approvedStages.add(s);

      // Prepare defaults when entering next stage if not yet populated
      if (s === 1 && state.shotList.length === 0) {
        state.shotList = getDefaultShotList();
      }
      if (s === 2 && state.keyframes.length === 0) {
        state.keyframes = state.shotList.map((shot, idx) => ({
          shotIndex: idx,
          timestamp: Number(((shot.start + shot.end) * 0.5).toFixed(2)),
          dataUrl: null
        }));
      }
      if (s === 3) {
        const names = new Set();
        state.shotList.forEach((sh) => (sh.characters || []).forEach((c) => c.name && names.add(c.name)));
        state.uniqueCharacters = names.size > 0 ? Array.from(names) : ['Grandma'];
      }
      if (s === 4 && !state.partsSheetDataUrl) {
        showToast('Please generate, upload, or load the sample Parts Sheet before approving Stage 4.');
        state.approvedStages.delete(4);
        return;
      }
      if (s === 5 && state.cutPieces.length === 0) {
        showToast('Please run Auto-Cut so character pieces & pivots are extracted before approving Stage 5.');
        state.approvedStages.delete(5);
        return;
      }

      if (s < 8) {
        state.currentStage = s + 1;
      }
      renderApp();
    }

    function renderStepper() {
      const nav = document.getElementById('stepperNav');
      const maxUnlocked = Math.min(8, state.approvedStages.size + 1);

      nav.innerHTML = STAGES.map((st) => {
        const isApproved = state.approvedStages.has(st.id);
        const isCurrent = state.currentStage === st.id;
        const isLocked = st.id > maxUnlocked;

        let cls = 'text-left px-2.5 py-2 rounded-lg border transition flex flex-col justify-between ';
        if (isCurrent) {
          cls += 'bg-rose-600/20 border-rose-500 text-white shadow-sm';
        } else if (isApproved) {
          cls += 'bg-emerald-950/35 border-emerald-700/60 text-emerald-200 hover:bg-emerald-900/40 cursor-pointer';
        } else if (!isLocked) {
          cls += 'bg-slate-800/70 border-slate-700 text-slate-200 hover:bg-slate-800 cursor-pointer';
        } else {
          cls += 'bg-[#12151e] border-slate-800/80 text-slate-500 cursor-not-allowed opacity-65';
        }

        const badge = isApproved ? '✓' : isLocked ? '🔒' : '●';
        return `
          <button data-stage="${st.id}" class="${cls}" ${isLocked ? 'disabled' : ''}>
            <div class="flex items-center justify-between w-full text-[11px] font-bold">
              <span class="truncate">${st.title}</span>
              <span>${badge}</span>
            </div>
            <span class="text-[10px] opacity-75 truncate mt-0.5">${st.desc}</span>
          </button>
        `;
      }).join('');

      nav.querySelectorAll('button[data-stage]').forEach((btn) => {
        btn.addEventListener('click', () => goToStage(Number(btn.dataset.stage)));
      });
    }

          if (field === 'camAngle') shot.camera.angle = val;
          if (field === 'envSurf') shot.environment.surfaces = val;
          if (field === 'envProps') shot.environment.props = val;
          if (field === 'charName') {
            if (!shot.characters[0]) shot.characters[0] = { name: val, pose: '', action: '' };

    async function captureSingleKeyframe(shotIdx, timestamp) {
      if (state.videoObjectUrl) {
        return new Promise((resolve) => {
          const v = document.createElement('video');
          v.src = state.videoObjectUrl;
          v.muted = true;
          v.currentTime = Math.max(0, timestamp);
          v.onseeked = () => {
            const c = document.createElement('canvas');
            c.width = v.videoWidth || 360;
            c.height = v.videoHeight || 640;
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/png'));
          };
          v.onerror = () => resolve(generateReferenceKeyframeDataUrl(shotIdx));
        });
      }
      return generateReferenceKeyframeDataUrl(shotIdx);
    }

      document.querySelectorAll('.role-select').forEach((sel) => {
        sel.addEventListener('change', (e) => {

      // Draw interactive pivot crosshair editor
      if (selectedPiece) {
        const pCanvas = document.getElementById('pivotEditorCanvas');
        const pCtx = pCanvas.getContext('2d');
        const pieceImg = await loadImage(selectedPiece.haloDataUrl);

        const drawPivotView = () => {
          pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
          const scale = Math.min((pCanvas.width - 40) / pieceImg.width, (pCanvas.height - 40) / pieceImg.height);
          const dw = pieceImg.width * scale;
          const dh = pieceImg.height * scale;
          const dx = (pCanvas.width - dw) / 2;
          const dy = (pCanvas.height - dh) / 2;

          pCtx.drawImage(pieceImg, dx, dy, dw, dh);

          const px = dx + selectedPiece.pivotX * dw;
          const py = dy + selectedPiece.pivotY * dh;

          // Crosshair lines
          pCtx.strokeStyle = '#fbbf24';
          pCtx.lineWidth = 1.5;
          pCtx.beginPath();
          pCtx.moveTo(px - 22, py);
          pCtx.lineTo(px + 22, py);
          pCtx.moveTo(px, py - 22);
          pCtx.lineTo(px, py + 22);
          pCtx.stroke();

          // Anchor circle
          pCtx.fillStyle = '#e11d48';
          pCtx.beginPath();
          pCtx.arc(px, py, 7, 0, Math.PI * 2);
          pCtx.fill();
          pCtx.strokeStyle = '#ffffff';
          pCtx.lineWidth = 2;
          pCtx.stroke();

          return { dx, dy, dw, dh };
        };

        let bounds = drawPivotView();
        let dragging = false;

        const updatePivotFromPointer = (clientX, clientY) => {
          const rect = pCanvas.getBoundingClientRect();
          const cx = ((clientX - rect.left) / rect.width) * pCanvas.width;
          const cy = ((clientY - rect.top) / rect.height) * pCanvas.height;
          selectedPiece.pivotX = Math.max(0, Math.min(1, (cx - bounds.dx) / bounds.dw));
          selectedPiece.pivotY = Math.max(0, Math.min(1, (cy - bounds.dy) / bounds.dh));
          bounds = drawPivotView();
        };

        pCanvas.addEventListener('pointerdown', (e) => {
          dragging = true;
          pCanvas.setPointerCapture(e.pointerId);
          updatePivotFromPointer(e.clientX, e.clientY);
        });
        pCanvas.addEventListener('pointermove', (e) => {
          if (dragging) updatePivotFromPointer(e.clientX, e.clientY);
        });
        pCanvas.addEventListener('pointerup', () => {
          if (dragging) {
            dragging = false;
            renderApp();
          }
        });
      }

      bindFooterButtons();
    }

    async function exportDeterministicMp4(compositeCanvas) {
      const fps = 30;
      const width = 720;
      const height = 1280;
      const duration = state.timelineConfig.duration;
      const totalFrames = Math.max(1, Math.ceil(duration * fps));

      if (typeof VideoEncoder === 'undefined') {
        throw new Error('WebCodecs VideoEncoder is not supported in this browser.');
      }

      state.isExporting = true;
      state.isPlaying = false;
      state.exportProgress = 0;
      state.exportStatus = 'Initializing WebCodecs H.264 encoder & mp4-muxer...';
      renderApp();

      const muxer = new Muxer({
        target: new ArrayBufferTarget(),
        video: {
          codec: 'avc',
          width,
          height
        },
        fastStart: 'in-memory'
      });

      const encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => console.error(e)
      });

      encoder.configure({
        codec: 'avc1.4d002a',
        width,
        height,
        bitrate: 4_500_000,
        framerate: fps
      });

      const exportCanvas = document.getElementById('exportCanvas') || compositeCanvas;

      for (let frameIdx = 0; frameIdx < totalFrames; frameIdx++) {
        const t = frameIdx / fps;
        renderCompositeFrame(exportCanvas, t);

        const timestampUs = Math.round((frameIdx / fps) * 1_000_000);
        const frame = new VideoFrame(exportCanvas, {
          timestamp: timestampUs,
          duration: Math.round(1_000_000 / fps)
        });

        encoder.encode(frame, { keyFrame: frameIdx % 30 === 0 });
        frame.close();

        if (frameIdx % 5 === 0 || frameIdx === totalFrames - 1) {
          state.exportProgress = Math.round(((frameIdx + 1) / totalFrames) * 100);
          state.exportStatus = `Encoding frame ${frameIdx + 1} / ${totalFrames} (${state.exportProgress}%)...`;
          const bar = document.getElementById('exportProgressBar');
          const txt = document.getElementById('exportStatusText');
          if (bar) bar.style.width = `${state.exportProgress}%`;
          if (txt) txt.textContent = state.exportStatus;
          await new Promise((r) => setTimeout(r, 0));
        }
      }

      await encoder.flush();
      muxer.finalize();

      const { buffer } = muxer.target;
      const blob = new Blob([buffer], { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'reconstructed_silent.mp4';
      a.click();

      state.isExporting = false;
      state.exportStatus = `Exported reconstructed_silent.mp4 (${totalFrames} frames @ ${fps}fps, 720×1280).`;
      renderApp();
    }

        case 2: renderStage2(container); break;
        case 3: await renderStage3(container); break;
        case 4: renderStage4(container); break;
        case 5: await renderStage5(container); break;
        case 6: await renderStage6(container); break;
        case 7: await renderStage7(container); break;
        case 8: await renderStage8(container); break;
      }
    }

    // Allows testing all stages quickly with the built-in Grandma + 3D Scarf preset while keeping all 8 stages reviewable
    document.getElementById('quickDemoJumpBtn').addEventListener('click', async () => {
      state.inputMode = 'demo';
      state.shotList = getDefaultShotList();
      state.keyframes = [
        { shotIndex: 0, timestamp: 0.0, dataUrl: generateReferenceKeyframeDataUrl(0) },
        { shotIndex: 1, timestamp: 1.0, dataUrl: generateReferenceKeyframeDataUrl(1) }
      ];
      state.partsSheetDataUrl = generateBuiltInGrandmaPartsSheet();
      state.partsSheetSource = 'sample';
      state.cutPieces = await runAutoCutPipeline(state.partsSheetDataUrl, state.chromaTolerance, state.haloRadius);
      if (state.cutPieces.length > 0) state.selectedPieceId = state.cutPieces[0].id;
      [1, 2, 3, 4, 5, 6, 7].forEach((s) => state.approvedStages.add(s));
      state.currentStage = 8;
      state.currentTime = 1.65;
      showToast('Loaded full Grandma + 3D Growing Scarf reference preset! You can click any stage tab (1–8) to review or tweak.');
      renderApp();
    });

    // Boot application at Stage 1
    renderApp();
  </script>
</body>
</html>
